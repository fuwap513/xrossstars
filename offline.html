<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11151b" />
    <meta name="application-name" content="Xross Stars 検証アプリ" />
    <title>オフライン | Xross Stars 検証アプリ</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1115;
        color: #f5f7fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: linear-gradient(180deg, #11151b 0%, #0a0c10 100%);
      }
      main {
        width: min(100%, 460px);
        padding: 20px;
        border-radius: 18px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
      }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0 0 10px; line-height: 1.7; }
      a {
        display: inline-flex;
        margin-top: 10px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 12px;
        background: #5d76ff;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>オフラインです</h1>
      <p>通信できないため最新データの取得はできませんが、保存済みのデッキ構成やプリセットは引き続き利用できます。</p>
      <p>ホーム画面追加済みのPWAとして開いている場合も、そのまま再表示を試せます。接続が回復したら再読み込みして最新アセットを取得してください。</p>
      <a href="/">アプリに戻る</a>
    </main>
  </body>
</html>
